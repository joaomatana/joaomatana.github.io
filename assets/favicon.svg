<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.45" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="16" height="16" fill="#07090f"/>
  <g fill="#00ff9f" filter="url(#g)">
    <!-- J -->
    <rect x="3" y="4"  width="4" height="1"/>
    <rect x="5" y="5"  width="1" height="5"/>
    <rect x="2" y="9"  width="1" height="1"/>
    <rect x="3" y="10" width="2" height="1"/>
    <!-- M -->
    <rect x="8"  y="4" width="1" height="7"/>
    <rect x="12" y="4" width="1" height="7"/>
    <rect x="9"  y="5" width="1" height="1"/>
    <rect x="11" y="5" width="1" height="1"/>
    <rect x="10" y="6" width="1" height="1"/>
  </g>
</svg>
